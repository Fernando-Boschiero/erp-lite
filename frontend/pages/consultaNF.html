<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../css/formFornecedores.css" />
    <title>Controle de Custos</title>
  </head>
  <body>
    <div class="gerenciamento-container">
      <h1>CONTROLE DE CUSTOS</h1>

      <!-- FILTERS -->
      <div class="consulta-controls">
        <div class="consulta-filters">
          <button type="button" id="btn-atualizar" class="refresh-button">
            🔄
          </button>
          <div class="filter-group">
            <input
              class="campo-busca"
              type="text"
              id="searchInput"
              placeholder="Buscar por aplicação, pedido, fornecedor, NF..." />
          </div>
          <div class="filter-group">
            <label>De:</label>
            <input type="date" id="dataInicio" />
          </div>
          <div class="filter-group">
            <label>Até:</label>
            <input type="date" id="dataFim" />
          </div>
          <button type="button" id="btn-limpar-filtro">Limpar</button>
        </div>
      </div>

      <!-- TABLE -->
      <div class="table-wrapper">
        <table id="tabela-custos">
          <thead>
            <tr>
              <th>Aplicação</th>
              <th>No. Pedido</th>
              <th>Fornecedor (NF)</th>
              <th>Previsão Entrega</th>
              <th>No. NF</th>
              <th>Valor NF</th>
              <th>Status Recebimento</th>
              <th>No. Nota Venda</th>
              <th>Data Emissão NV</th>
              <th>Status Pagamento</th>
            </tr>
          </thead>
          <tbody id="tabela-custos-body"></tbody>
        </table>
      </div>

      <!-- TOTALS -->
      <div class="totals-bar">
        <span>Total de registros: <strong id="total-registros">0</strong></span>
        <span>Valor total NFs: <strong id="total-valor">R$ -</strong></span>
      </div>
    </div>

    <script src="../js/sharedFornecedores.js"></script>
    <script src="../js/consultaNF.js"></script>
  </body>
</html>
