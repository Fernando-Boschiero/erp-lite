<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../css/formFornecedores.css" />
    <title>Consulta de Cotações</title>
  </head>
  <body>
    <div class="gerenciamento-container">
      <h1>COTAÇÕES</h1>
      <div class="consulta-controls">
        <input
          type="text"
          id="busca"
          placeholder="Buscar por número, cliente, status..." />
        <button type="button" id="btn-nova-cotacao">+ NOVA COTAÇÃO</button>
      </div>
      <table id="tabela-cotacoes">
        <thead>
          <tr>
            <th>No. da Cotação</th>
            <th>Cliente</th>
            <th>Data</th>
            <th>Revisão</th>
            <th>Status</th>
            <th>Total Geral</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="resultado-cotacoes"></tbody>
      </table>
    </div>
    <script src="../js/consultaCotacoes.js"></script>
  </body>
</html>
