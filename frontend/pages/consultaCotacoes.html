<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../css/formFornecedores.css" />
    <title>Consulta de Cotações</title>
  </head>
  <body>
    <div class="gerenciamento-container">
      <h1>COTAÇÕES</h1>
      <div class="consulta-controls">
        <div class="consulta-filters">
          <button type="button" id="btn-refresh">🔄</button>
          <div class="filter-group">
            <input
              type="text"
              id="busca"
              placeholder="Buscar por número, fornecedor, status..." />
          </div>
          <div class="filter-group">
            <label for="filtroDe">DE</label>
            <input type="date" id="filtroDe" />
          </div>
          <div class="filter-group">
            <label for="filtroAte">ATÉ</label>
            <input type="date" id="filtroAte" />
          </div>
          <button type="button" id="btn-limpar-filtros">Limpar</button>
        </div>
        <button type="button" id="btn-nova-cotacao">+ NOVA COTAÇÃO</button>
      </div>
      <table id="tabela-cotacoes">
        <thead>
          <tr>
            <th>No. da Cotação</th>
            <th>Cliente</th>
            <th>Data</th>
            <th id="header-data-prevista" style="cursor: pointer">
              Data Prevista ↕
            </th>
            <th>Revisão</th>
            <th>Status</th>
            <th>Total Geral</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="resultado-cotacoes"></tbody>
      </table>
    </div>
    <!-- MODAL REVISÕES -->
    <div
      id="modal-revisoes"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      ">
      <div
        style="
          background: white;
          border-radius: 8px;
          padding: 20px;
          width: 600px;
          max-width: 90%;
          max-height: 80vh;
          overflow-y: auto;
        ">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
          ">
          <h2 id="modal-revisoes-titulo">Histórico de Revisões</h2>
          <button
            type="button"
            id="btn-fechar-modal"
            style="
              font-size: 1.2em;
              background: none;
              border: none;
              cursor: pointer;
            ">
            ✕
          </button>
        </div>
        <table
          id="tabela-revisoes"
          style="width: 100%; border-collapse: collapse">
          <thead>
            <tr>
              <th
                style="
                  text-align: left;
                  padding: 8px;
                  border-bottom: 1px solid #ccc;
                ">
                Revisão
              </th>
              <th
                style="
                  text-align: left;
                  padding: 8px;
                  border-bottom: 1px solid #ccc;
                ">
                Data
              </th>
              <th
                style="
                  text-align: left;
                  padding: 8px;
                  border-bottom: 1px solid #ccc;
                ">
                Status
              </th>
              <th
                style="
                  text-align: left;
                  padding: 8px;
                  border-bottom: 1px solid #ccc;
                ">
                Ações
              </th>
            </tr>
          </thead>
          <tbody id="resultado-revisoes"></tbody>
        </table>
      </div>
    </div>
    <script src="../js/sharedFornecedores.js"></script>
    <script src="../js/consultaCotacoes.js"></script>
  </body>
</html>
