<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../css/formFornecedores.css" />
    <title>Consultar Contatos</title>
  </head>
  <body>
    <div class="gerenciamento-container">
      <h1>CONSULTAR CONTATOS</h1>
      <div class="consulta-controls">
        <input
          class="busca-fornecedor"
          type="text"
          id="searchInput"
          placeholder="Buscar por nome, email, cliente..." />
        <div id="column-toggles" class="column-toggles">
          <label><input type="checkbox" data-column="0" checked /> Nome</label>
          <label
            ><input type="checkbox" data-column="1" checked /> E-mail</label
          >
          <label
            ><input type="checkbox" data-column="2" checked /> Telefone</label
          >
          <label
            ><input type="checkbox" data-column="3" checked /> Cliente</label
          >
          <label
            ><input type="checkbox" data-column="4" checked /> Unidade</label
          >
        </div>
      </div>

      <div class="table-wrapper">
        <table id="tabela-contatos">
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Telefone</th>
              <th>Cliente</th>
              <th>Unidade</th>
              <th>Apagar</th>
            </tr>
          </thead>
          <tbody id="resultado-contatos"></tbody>
        </table>
      </div>
    </div>

    <script src="../js/sharedFornecedores.js"></script>
    <script src="../js/consultaContatos.js"></script>
  </body>
</html>
