<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../css/formFornecedores.css" />
    <title>Contas a Pagar</title>
  </head>
  <body>
    <div class="gerenciamento-container">
      <h1>CONTAS A PAGAR</h1>

      <!-- ACTIONS BAR -->
      <div class="consulta-controls">
        <div class="consulta-filters">
          <button type="button" id="btn-atualizar" class="refresh-button">
            🔄
          </button>
          <div class="filter-group">
            <input
              type="text"
              id="searchInput"
              class="campo-busca"
              placeholder="Buscar por fornecedor, tipo, NF, pedido..." />
          </div>
          <div class="filter-group">
            <label>De:</label>
            <input type="date" id="dataInicio" />
          </div>
          <div class="filter-group">
            <label>Até:</label>
            <input type="date" id="dataFim" />
          </div>
          <button type="button" id="btn-limpar-filtro">Limpar</button>
        </div>
        <button type="button" id="btn-novo-lancamento">
          + Novo Lançamento
        </button>
      </div>

      <!-- MODAL NOVO LANÇAMENTO -->
      <div
        id="modal-lancamento"
        style="
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.5);
          z-index: 1000;
          justify-content: center;
          align-items: center;
        ">
        <div
          style="
            background: white;
            border-radius: 8px;
            padding: 32px;
            width: 500px;
            max-width: 90%;
          ">
          <h2 style="margin-bottom: 16px">NOVO LANÇAMENTO</h2>
          <hr style="margin-bottom: 16px" />

          <div class="input-group" style="margin-bottom: 12px">
            <label for="lancFornecedor">FORNECEDOR / DESCRIÇÃO</label>
            <input
              type="text"
              id="lancFornecedor"
              placeholder="Ex: CPFL Energia, Recibo serviço..." />
          </div>

          <div class="input-group" style="margin-bottom: 12px">
            <label for="lancTipo">TIPO</label>
            <select id="lancTipo">
              <option value="">Selecione o tipo...</option>
              <optgroup label="Geral">
                <option value="Geral - Aluguel de Equipamento">
                  Geral - Aluguel de Equipamento
                </option>
                <option value="Geral - Ativo">Geral - Ativo</option>
                <option value="Geral - Benefícios">Geral - Benefícios</option>

                <option value="Geral - Carta de Correção">
                  Geral - Carta de Correção
                </option>
                <option value="Geral - Complementar">
                  Geral - Complementar
                </option>
                <option value="Geral - Contas de Consumo">
                  Geral - Contas de Consumo
                </option>
                <option value="Geral - Consumível Fábrica">
                  Geral - Consumível Fábrica
                </option>
                <option value="Geral - Consumível Pessoal">
                  Geral - Consumível Pessoal
                </option>
                <option value="Geral - Demonstração">
                  Geral - Demonstração
                </option>
                <option value="Geral - Despachante">Geral - Despachante</option>
                <option value="Geral - Devolução">Geral - Devolução</option>
                <option value="Geral - Embalagem">Geral - Embalagem</option>
                <option value="Geral - Entrada">Geral - Entrada</option>
                <option value="Geral - Frete">Geral - Frete</option>
                <option value="Geral - Garantia">Geral - Garantia</option>
                <option value="Geral - Industrialização">
                  Geral - Industrialização
                </option>
                <option value="Geral - Manutenção">Geral - Manutenção</option>
                <option value="Geral - Material de Escritório">
                  Geral - Material de Escritório
                </option>
                <option value="Geral - Medicina do Trabalho">
                  Geral - Medicina do Trabalho
                </option>
                <option value="Geral - Serviço">Geral - Serviço</option>
                <option value="Geral - TI">Geral - TI</option>
                <option value="Geral - Veículos">Geral - Veículos</option>
              </optgroup>
              <optgroup label="Vinculado a Pedido de Compra">
                <option value="PC - Aluguel de Equipamento">
                  PC - Aluguel de Equipamento
                </option>
                <option value="PC - Ativo">PC - Ativo</option>
                <option value="PC - Benefícios">PC - Benefícios</option>
                <option value="PC - Carta de Correção">
                  PC - Carta de Correção
                </option>
                <option value="PC - Complementar">PC - Complementar</option>
                <option value="PC - Contas de Consumo">
                  PC - Contas de Consumo
                </option>
                <option value="PC - Consumível Fábrica">
                  PC - Consumível Fábrica
                </option>
                <option value="PC - Consumível Pessoal">
                  PC - Consumível Pessoal
                </option>
                <option value="PC - Demonstração">PC - Demonstração</option>
                <option value="PC - Despachante">PC - Despachante</option>
                <option value="PC - Devolução">PC - Devolução</option>
                <option value="PC - Embalagem">PC - Embalagem</option>
                <option value="PC - Entrada">PC - Entrada</option>
                <option value="PC - Frete">PC - Frete</option>
                <option value="PC - Garantia">PC - Garantia</option>
                <option value="PC - Industrialização">
                  PC - Industrialização
                </option>
                <option value="PC - Manutenção">PC - Manutenção</option>
                <option value="PC - Matéria Prima">PC - Matéria Prima</option>
                <option value="PC - Material de Escritório">
                  PC - Material de Escritório
                </option>
                <option value="PC - Medicina do Trabalho">
                  PC - Medicina do Trabalho
                </option>
                <option value="PC - Serviço">PC - Serviço</option>
                <option value="PC - TI">PC - TI</option>
                <option value="PC - Veículos">PC - Veículos</option>
              </optgroup>
              <optgroup label="Vinculado a Cotação (futuro)">
                <option value="Produto Acabado">Produto Acabado</option>
                <option value="Serviço - Venda">Serviço - Venda</option>
              </optgroup>
            </select>
          </div>

          <div class="input-group" style="margin-bottom: 12px">
            <label for="lancValor">VALOR TOTAL</label>
            <input type="text" id="lancValor" placeholder="Ex: 1.250,00" />
          </div>

          <div class="input-group" style="margin-bottom: 12px">
            <label for="lancDataEmissao">DATA DE EMISSÃO</label>
            <input type="date" id="lancDataEmissao" />
          </div>

          <div class="input-group" style="margin-bottom: 12px">
            <label for="lancVencimento">DATA DE VENCIMENTO</label>
            <input type="date" id="lancVencimento" />
          </div>

          <div style="display: flex; gap: 12px; margin-top: 20px">
            <button
              type="button"
              id="btn-salvar-lancamento"
              style="
                background: #1a5c35;
                color: white;
                border: none;
                border-radius: 4px;
                padding: 8px 20px;
                cursor: pointer;
                flex: 1;
              ">
              SALVAR
            </button>
            <button
              type="button"
              id="btn-cancelar-lancamento"
              style="
                background: #6c757d;
                color: white;
                border: none;
                border-radius: 4px;
                padding: 8px 20px;
                cursor: pointer;
                flex: 1;
              ">
              CANCELAR
            </button>
          </div>
        </div>
      </div>

      <!-- TABLE -->
      <div class="table-wrapper">
        <table id="tabela-nfs">
          <thead>
            <tr>
              <th>No. NF</th>
              <th>
                Data Emissão <span class="sort-btn" data-col="dhEmi">↕</span>
              </th>
              <th>
                Vencimento <span class="sort-btn" data-col="dVenc">↕</span>
              </th>
              <th>Fornecedor</th>
              <th>Tipo</th>
              <th>Valor Total</th>
              <th>Status Pagamento</th>
              <th>Direção</th>
              <th class="no-print">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-nfs-body"></tbody>
        </table>
      </div>

      <div class="totals-bar">
        <span>Total de registros: <strong id="total-registros">0</strong></span>
        <span>Valor total: <strong id="total-valor">R$ -</strong></span>
      </div>
    </div>

    <script src="../js/sharedFornecedores.js"></script>
    <script src="../js/contasPagar.js"></script>
  </body>
</html>
