<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../css/relatorios.css" />
    <title>Custos por Projeto</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="relatorio-container">
      <h1>CUSTOS POR PROJETO</h1>

      <!-- FILTERS -->
      <div class="relatorio-filters">
        <label>De:</label>
        <input type="date" id="dataInicio" />
        <label>Até:</label>
        <input type="date" id="dataFim" />
        <label>Projeto:</label>
        <select id="filtroAplicacao">
          <option value="Todos">Todos os Projetos</option>
        </select>
        <button type="button" class="btn-relatorio" id="btn-atualizar">
          Atualizar
        </button>
        <button type="button" class="btn-relatorio secondary" id="btn-pdf">
          🖨️ Exportar PDF
        </button>
      </div>

      <!-- KPI SUMMARY -->
      <div class="kpi-grid" style="grid-template-columns: repeat(3, 1fr)">
        <div class="kpi-card danger">
          <div class="kpi-label">Custo Total</div>
          <div class="kpi-value" id="total-geral">R$ -</div>
          <div class="kpi-sub">No período</div>
        </div>
        <div class="kpi-card warning">
          <div class="kpi-label">Total Pago</div>
          <div class="kpi-value" id="total-pago">R$ -</div>
          <div class="kpi-sub">Duplicatas pagas</div>
        </div>
        <div class="kpi-card info">
          <div class="kpi-label">Total em Aberto</div>
          <div class="kpi-value" id="total-aberto">R$ -</div>
          <div class="kpi-sub">Duplicatas abertas</div>
        </div>
      </div>

      <!-- CHART -->
      <div class="chart-card" style="margin-bottom: 20px">
        <h2>Top Projetos por Custo Total</h2>
        <div class="chart-wrapper" style="height: 300px">
          <canvas id="chart-bar"></canvas>
        </div>
      </div>

      <!-- TABLE BY PROJECT -->
      <div id="tabela-projetos"></div>
    </div>

    <script src="../js/sharedFornecedores.js"></script>
    <script src="../js/custosProjeto.js"></script>
  </body>
</html>
