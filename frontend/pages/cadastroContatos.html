<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../css/formFornecedores.css" />
    <title>Cadastrar / Atualizar Contato</title>
  </head>
  <body>
    <div class="gerenciamento-container">
      <h1>CADASTRAR / ATUALIZAR CONTATO</h1>

      <!-- CADASTRAR -->
      <h2>CADASTRAR NOVO CONTATO</h2>
      <hr />
      <div class="container-multiple-inputs">
        <div class="input-group">
          <label for="nomeContato">NOME</label>
          <input type="text" id="nomeContato" placeholder="Nome completo" />
        </div>
        <div class="input-group">
          <label for="emailContato">E-MAIL</label>
          <input
            type="email"
            id="emailContato"
            placeholder="email@empresa.com" />
        </div>
        <div class="input-group">
          <label for="telefoneContato">TELEFONE</label>
          <input
            type="text"
            id="telefoneContato"
            placeholder="(00) 00000-0000" />
        </div>
      </div>
      <div class="container-multiple-inputs">
        <div class="input-group">
          <label for="clienteContato">CLIENTE</label>
          <select id="clienteContato">
            <option value="">Selecione um cliente...</option>
          </select>
        </div>
        <div class="input-group">
          <label for="unidadeContato">UNIDADE</label>
          <input
            type="text"
            id="unidadeContato"
            placeholder="Ex: Matriz, Filial SP..." />
        </div>
      </div>
      <button type="button" id="btn-cadastrar">CADASTRAR</button>

      <br /><br />

      <!-- ATUALIZAR -->
      <h2>ATUALIZAR CONTATO</h2>
      <hr />
      <div class="input-group">
        <label for="selectContato">SELECIONAR CONTATO</label>
        <select id="selectContato">
          <option value="">Selecione um contato...</option>
        </select>
      </div>
      <div class="container-multiple-inputs">
        <div class="input-group">
          <label for="nomeContatoUpdate">NOME</label>
          <input type="text" id="nomeContatoUpdate" />
        </div>
        <div class="input-group">
          <label for="emailContatoUpdate">E-MAIL</label>
          <input type="email" id="emailContatoUpdate" />
        </div>
        <div class="input-group">
          <label for="telefoneContatoUpdate">TELEFONE</label>
          <input type="text" id="telefoneContatoUpdate" />
        </div>
      </div>
      <div class="container-multiple-inputs">
        <div class="input-group">
          <label for="clienteContatoUpdate">CLIENTE</label>
          <select id="clienteContatoUpdate">
            <option value="">Selecione um cliente...</option>
          </select>
        </div>
        <div class="input-group">
          <label for="unidadeContatoUpdate">UNIDADE</label>
          <input type="text" id="unidadeContatoUpdate" />
        </div>
      </div>
      <button type="button" id="btn-atualizar">ATUALIZAR</button>
    </div>

    <script src="../js/sharedFornecedores.js"></script>
    <script src="../js/cadastroContatos.js"></script>
  </body>
</html>
