<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../css/formFornecedores.css" />
    <title>Cadastro de Nota Fiscal</title>
  </head>
  <body>
    <div class="gerenciamento-container">
      <h1>CADASTRO DE NOTA FISCAL</h1>

      <!-- STEP 1: XML UPLOAD -->
      <div id="step-upload">
        <div class="input-group xml-upload">
          <label for="xmlInput"
            >IMPORTAR XML DA NF-e (Nota Fiscal Eletrônica) ou NFS-e (Nota Fiscal
            de Serviços Eletrônica)</label
          >
          <input type="file" id="xmlInput" accept=".xml" />
          <button type="button" id="btn-processar-xml">PROCESSAR XML</button>
        </div>
      </div>

      <!-- STEP 2: REVIEW FORM (hidden until XML is parsed) -->
      <div id="step-review" style="display: none">
        <!-- CABEÇALHO -->
        <h2>DADOS DA NOTA FISCAL</h2>
        <hr />
        <div class="container-multiple-inputs">
          <div class="input-group">
            <label for="nNF">NÚMERO DA NF</label>
            <input type="text" id="nNF" readonly />
          </div>
          <div class="input-group">
            <label for="dhEmi">DATA DE EMISSÃO</label>
            <input type="text" id="dhEmi" readonly />
          </div>
          <div class="input-group">
            <label for="xNome">EMITENTE</label>
            <input type="text" id="xNome" readonly />
          </div>
        </div>

        <!-- TIPO DA NF -->
        <h2>CLASSIFICAÇÃO</h2>
        <hr />
        <div class="container-multiple-inputs">
          <div class="input-group">
            <label for="tipoNF">TIPO DA NOTA FISCAL</label>
            <select id="tipoNF">
              <option value="">Selecione o tipo...</option>
              <optgroup label="Geral">
                <option value="Geral - Aluguel de Equipamento">
                  Geral - Aluguel de Equipamento
                </option>
                <option value="Geral - Ativo">Geral - Ativo</option>
                <option value="Geral - Carta de Correção">
                  Geral - Carta de Correção
                </option>
                <option value="Geral - Complementar">
                  Geral - Complementar
                </option>
                <option value="Geral - Contas de Consumo">
                  Geral - Contas de Consumo
                </option>
                <option value="Geral - Consumível Fábrica">
                  Geral - Consumível Fábrica
                </option>
                <option value="Geral - Consumível Pessoal">
                  Geral - Consumível Pessoal
                </option>
                <option value="Geral - Demonstração">
                  Geral - Demonstração
                </option>
                <option value="Geral - Despachante">Geral - Despachante</option>
                <option value="Geral - Devolução">Geral - Devolução</option>
                <option value="Geral - Embalagem">Geral - Embalagem</option>
                <option value="Geral - Entrada">Geral - Entrada</option>
                <option value="Geral - Frete">Geral - Frete</option>
                <option value="Geral - Garantia">Geral - Garantia</option>
                <option value="Geral - Industrialização">
                  Geral - Industrialização
                </option>
                <option value="Geral - Manutenção">Geral - Manutenção</option>
                <option value="Geral - Material de Escritório">
                  Geral - Material de Escritório
                </option>
                <option value="Geral - Medicina do Trabalho">
                  Geral - Medicina do Trabalho
                </option>
                <option value="Geral - Serviço">Geral - Serviço</option>
                <option value="Geral - TI">Geral - TI</option>
                <option value="Geral - Veículos">Geral - Veículos</option>
              </optgroup>
              <optgroup label="Vinculado a Pedido de Compra">
                <option value="PC - Aluguel de Equipamento">
                  PC - Aluguel de Equipamento
                </option>
                <option value="PC - Ativo">PC - Ativo</option>
                <option value="PC - Carta de Correção">
                  PC - Carta de Correção
                </option>
                <option value="PC - Complementar">PC - Complementar</option>
                <option value="PC - Contas de Consumo">
                  PC - Contas de Consumo
                </option>
                <option value="PC - Consumível Fábrica">
                  PC - Consumível Fábrica
                </option>
                <option value="PC - Consumível Pessoal">
                  PC - Consumível Pessoal
                </option>
                <option value="PC - Demonstração">PC - Demonstração</option>
                <option value="PC - Despachante">PC - Despachante</option>
                <option value="PC - Devolução">PC - Devolução</option>
                <option value="PC - Embalagem">PC - Embalagem</option>
                <option value="PC - Entrada">PC - Entrada</option>
                <option value="PC - Frete">PC - Frete</option>
                <option value="PC - Garantia">PC - Garantia</option>
                <option value="PC - Industrialização">
                  PC - Industrialização
                </option>
                <option value="PC - Manutenção">PC - Manutenção</option>
                <option value="PC - Matéria Prima">PC - Matéria Prima</option>
                <option value="PC - Material de Escritório">
                  PC - Material de Escritório
                </option>
                <option value="PC - Medicina do Trabalho">
                  PC - Medicina do Trabalho
                </option>
                <option value="PC - Serviço">PC - Serviço</option>
                <option value="PC - TI">PC - TI</option>
                <option value="PC - Veículos">PC - Veículos</option>
              </optgroup>
              <optgroup label="Vinculado a Cotação (futuro)">
                <option value="Produto Acabado">Produto Acabado</option>
                <option value="Serviço - Venda">Serviço - Venda</option>
              </optgroup>
            </select>
          </div>
          <div class="input-group">
            <label for="direcaoNF">DIREÇÃO</label>
            <select id="direcaoNF">
              <option value="Entrada">Entrada (Custo)</option>
              <option value="Saída">Saída (Recebível)</option>
              <option value="Sem valor financeiro">Sem Valor Financeiro</option>
            </select>
          </div>
        </div>

        <!-- VÍNCULO AO PEDIDO (conditional) -->
        <div id="vinculo-pedido" style="display: none">
          <h2>VÍNCULO AO PEDIDO DE COMPRA</h2>
          <hr />
          <div class="container-multiple-inputs">
            <div class="input-group">
              <label for="pedidoSelect">ADICIONAR PEDIDO</label>
              <select id="pedidoSelect">
                <option value="">Selecione o pedido...</option>
              </select>
              <button
                type="button"
                id="btn-adicionar-pedido"
                style="
                  margin-top: 8px;
                  background: #1a5c35;
                  color: white;
                  border: none;
                  border-radius: 4px;
                  padding: 6px 14px;
                  cursor: pointer;
                ">
                + ADICIONAR
              </button>
            </div>
          </div>
          <div id="pedidos-vinculados" style="margin-top: 12px"></div>
        </div>

        <!-- VÍNCULO À COTAÇÃO (future - shown but disabled) -->
        <div id="vinculo-cotacao" style="display: none">
          <h2>VÍNCULO À COTAÇÃO</h2>
          <hr />
          <div class="container-multiple-inputs">
            <div class="input-group">
              <label>COTAÇÃO</label>
              <input
                type="text"
                readonly
                placeholder="Funcionalidade disponível em breve" />
            </div>
          </div>
        </div>

        <!-- ITENS DA NF -->
        <h2>ITENS DA NOTA FISCAL</h2>
        <hr />
        <table id="tabela-itens-nf">
          <thead>
            <tr>
              <th>Item</th>
              <th>Cód. Produto</th>
              <th>Descrição</th>
              <th>NCM</th>
              <th>Qtd.</th>
              <th>Un.</th>
              <th>Valor Unit.</th>
              <th>Valor Total</th>
              <th>ICMS</th>
              <th>IPI</th>
              <th>PIS</th>
              <th>COFINS</th>
            </tr>
          </thead>
          <tbody id="itens-nf-body"></tbody>
        </table>

        <!-- DUPLICATAS -->
        <h2>DUPLICATAS / PARCELAS</h2>
        <hr />
        <table id="tabela-duplicatas">
          <thead>
            <tr>
              <th>Nº Duplicata</th>
              <th>Vencimento</th>
              <th>Valor</th>
            </tr>
          </thead>
          <tbody id="duplicatas-body"></tbody>
        </table>

        <!-- TOTAL -->
        <div class="total_geral">
          <span>VALOR TOTAL DA NF</span>
          <span id="total-nf">R$ -</span>
        </div>

        <!-- ACTIONS -->
        <div class="form-actions no-print">
          <button type="button" id="btn-salvar-nf">SALVAR NOTA FISCAL</button>
          <button type="button" id="btn-cancelar-nf">CANCELAR</button>
        </div>
      </div>
    </div>

    <script src="../js/sharedFornecedores.js"></script>
    <script src="../js/cadastroNF.js"></script>
  </body>
</html>
