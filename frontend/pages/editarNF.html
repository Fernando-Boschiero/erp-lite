<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../css/formFornecedores.css" />
    <title>Editar Nota Fiscal</title>
  </head>
  <body>
    <div class="gerenciamento-container">
      <h1>EDITAR NOTA FISCAL</h1>

      <!-- READ-ONLY NF DATA -->
      <h2>DADOS DA NOTA FISCAL</h2>
      <hr />
      <div class="container-multiple-inputs">
        <div class="input-group">
          <label>NÚMERO DA NF</label>
          <input type="text" id="nNF" readonly />
        </div>
        <div class="input-group">
          <label>DATA DE EMISSÃO</label>
          <input type="text" id="dhEmi" readonly />
        </div>
        <div class="input-group">
          <label>EMITENTE</label>
          <input type="text" id="xNome" readonly />
        </div>
      </div>

      <!-- EDITABLE FIELDS -->
      <h2>CLASSIFICAÇÃO</h2>
      <hr />
      <div class="container-multiple-inputs">
        <div class="input-group">
          <label for="tipoNF">TIPO DA NOTA FISCAL</label>
          <select id="tipoNF">
            <option value="">Selecione o tipo...</option>
          </select>
        </div>
        <div class="input-group">
          <label for="direcaoNF">DIREÇÃO</label>
          <select id="direcaoNF">
            <option value="Entrada">Entrada (Custo)</option>
            <option value="Saída">Saída (Recebível)</option>
            <option value="Sem valor financeiro">Sem Valor Financeiro</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <!-- STATUS PAGAMENTO -->
        <h2>STATUS DE PAGAMENTO</h2>
        <hr />
        <div class="container-multiple-inputs">
          <div class="input-group">
            <label>STATUS ATUAL</label>
            <input type="text" id="statusPagamentoDisplay" readonly />
          </div>
          <!-- only shown when NF has no duplicatas -->
          <div
            class="input-group"
            id="statusPagamentoEdit"
            style="display: none">
            <label for="statusPagamento">ALTERAR STATUS</label>
            <select id="statusPagamento">
              <option value="Aberta">Aberta</option>
              <option value="Paga">Paga</option>
            </select>
          </div>
        </div>
      </div>

      <div id="vinculo-pedido" style="display: none">
        <h2>VÍNCULO AO PEDIDO DE COMPRA</h2>
        <hr />
        <div class="container-multiple-inputs">
          <div class="input-group">
            <label for="pedidoSelect">ADICIONAR PEDIDO</label>
            <select id="pedidoSelect">
              <option value="">Selecione o pedido...</option>
            </select>
            <button
              type="button"
              id="btn-adicionar-pedido"
              style="
                margin-top: 8px;
                background: #1a5c35;
                color: white;
                border: none;
                border-radius: 4px;
                padding: 6px 14px;
                cursor: pointer;
              ">
              + ADICIONAR
            </button>
          </div>
        </div>
        <div id="pedidos-vinculados" style="margin-top: 12px"></div>
      </div>

      <div id="vinculo-cotacao" style="display: none">
        <h2>VÍNCULO À COTAÇÃO</h2>
        <hr />
        <div class="container-multiple-inputs">
          <div class="input-group">
            <label for="cotacaoSelect">COTAÇÃO</label>
            <select id="cotacaoSelect">
              <option value="">Selecione a cotação...</option>
            </select>
            <button
              type="button"
              id="btn-adicionar-cotacao"
              style="
                margin-top: 8px;
                background: #1a5c35;
                color: white;
                border: none;
                border-radius: 4px;
                padding: 6px 14px;
                cursor: pointer;
              ">
              + ADICIONAR
            </button>
          </div>
        </div>
        <div id="cotacoes-vinculadas" style="margin-top: 12px"></div>
      </div>

      <!-- READ-ONLY ITEMS -->
      <h2>ITENS DA NOTA FISCAL</h2>
      <hr />
      <table id="tabela-itens-nf">
        <thead>
          <tr>
            <th>Descrição</th>
            <th>Qtd.</th>
            <th>Un.</th>
            <th>Valor Unit.</th>
            <th>Valor Total</th>
          </tr>
        </thead>
        <tbody id="itens-nf-body"></tbody>
      </table>

      <!-- READ-ONLY DUPLICATAS -->
      <h2>DUPLICATAS / PARCELAS</h2>
      <hr />
      <table id="tabela-duplicatas">
        <thead>
          <tr>
            <th>Nº Duplicata</th>
            <th>Vencimento</th>
            <th>Valor</th>
            <th>Status</th>
            <th class="no-print"></th>
          </tr>
        </thead>
        <tbody id="duplicatas-body"></tbody>
      </table>

      <div class="no-print" style="margin-top: 8px">
        <button
          type="button"
          id="btn-salvar-duplicatas"
          style="
            background: #1a5c35;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 14px;
            cursor: pointer;
          ">
          SALVAR DUPLICATAS
        </button>
      </div>

      <!-- MANUAL DUPLICATA (only shown when no duplicatas exist) -->
      <div id="secao-adicionar-duplicata" style="display: none">
        <h2>ADICIONAR DATA DE VENCIMENTO</h2>
        <hr />
        <div class="container-multiple-inputs">
          <div class="input-group">
            <label for="novaDupNumero">Nº DUPLICATA</label>
            <input type="text" id="novaDupNumero" placeholder="Ex: 001" />
          </div>
          <div class="input-group">
            <label for="novaDupVenc">DATA DE VENCIMENTO</label>
            <input type="date" id="novaDupVenc" />
          </div>
          <div class="input-group">
            <label for="novaDupValor">VALOR</label>
            <input type="text" id="novaDupValor" placeholder="Ex: 1.250,00" />
          </div>
        </div>
        <button type="button" id="btn-adicionar-duplicata">+ ADICIONAR</button>
      </div>

      <!-- ACTIONS -->
      <div class="form-actions no-print">
        <button type="button" id="btn-salvar-nf">SALVAR ALTERAÇÕES</button>
        <button type="button" id="btn-voltar">VOLTAR</button>
      </div>
    </div>

    <script src="../js/sharedFornecedores.js"></script>
    <script src="../js/editarNF.js"></script>
  </body>
</html>
