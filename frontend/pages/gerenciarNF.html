<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../css/formFornecedores.css" />
    <title>Gerenciar Notas Fiscais</title>
  </head>
  <body>
    <div class="gerenciamento-container">
      <h1>GERENCIAR NOTAS FISCAIS</h1>

      <!-- FILTERS -->
      <div class="filter-bar no-print">
        <input
          type="text"
          id="searchInput"
          placeholder="Buscar por NF, fornecedor, tipo, pedido..." />
        <div class="date-filter">
          <label>De:</label>
          <input type="date" id="dataInicio" />
          <label>Até:</label>
          <input type="date" id="dataFim" />
          <button type="button" id="btn-limpar-filtro">Limpar</button>
        </div>
        <button type="button" id="btn-atualizar">🔄</button>
      </div>

      <!-- TABLE -->
      <div class="table-wrapper">
        <table id="tabela-nfs">
          <thead>
            <tr>
              <th>No. NF</th>
              <th>Data Emissão</th>
              <th>Fornecedor (NF)</th>
              <th>Tipo</th>
              <th>Valor Total</th>
              <th>Status Pagamento</th>
              <th class="no-print">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-nfs-body"></tbody>
        </table>
      </div>

      <div class="totals-bar">
        <span>Total de registros: <strong id="total-registros">0</strong></span>
        <span>Valor total: <strong id="total-valor">R$ -</strong></span>
      </div>
    </div>

    <script src="../js/sharedFornecedores.js"></script>
    <script src="../js/gerenciarNF.js"></script>
  </body>
</html>
